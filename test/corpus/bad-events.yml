name: Triggers
on:
  push:
    branches: [main]
    branches-ignore: [dev]
  pull_request:
    paths: [src/**]
    paths-ignore: [docs/**]
  schedule:
    - cron: "61 25 * * *"
  puhs:
permissions:
  contents: read
jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
