name: Install tools
on: push
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          echo ${{ secrets.API_TOKEN }}
          curl -sSL https://example.com/install.sh | sudo sh
