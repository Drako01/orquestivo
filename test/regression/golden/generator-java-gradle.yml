# Generated by Orquestivo — review before committing.
# Static validation is not evidence that CI will pass.
# Note: Gradle wrapper validation is not added (no verified pinned action).
name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run project tests
        run: sh ./gradlew --no-daemon test
