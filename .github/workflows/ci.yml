name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Production dependency audit
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

  package-preview:
    name: Package installable preview VSIX
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - name: Inspect packaged extension
        run: |
          unzip -q orquestivo.vsix -d packaged
          test -s packaged/extension/dist/extension.js
          test -s packaged/extension/media/icon-128.png
          test -s packaged/extension/media/brand-approved-full.webp
          test -s packaged/extension/media/activity.svg
          test -f packaged/extension/package.nls.es.json
          if unzip -Z1 orquestivo.vsix | grep -E '^extension/(src/|test/|node_modules/|\.env|\.git/|test_script\.ps1$|media/brand-approved-full\.png$|media/readme-logo\.webp$)'; then
            echo "::error::Source, test or sensitive files leaked into VSIX"
            exit 1
          fi
      - name: Test the extracted VSIX in real Visual Studio Code
        env:
          ORQUESTIVO_PACKAGE_DIR: ${{ github.workspace }}/packaged/extension
        run: xvfb-run -a npm run test:integration
      - run: sha256sum orquestivo.vsix > orquestivo.vsix.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orquestivo-preview-vsix
          path: |
            orquestivo.vsix
            orquestivo.vsix.sha256
          if-no-files-found: error
          retention-days: 14
