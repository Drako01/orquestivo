# Manual release ONLY. No push, PR, tag or scheduled triggers.
name: publish
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_ORQUESTIVO after the release has been approved
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: orquestivo-release
  cancel-in-progress: false
jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_ORQUESTIVO'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          grep -Fq "## [$version]" CHANGELOG.md || { echo "::error::A released changelog entry is required."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: authorize
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
  package:
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - run: sha256sum orquestivo.vsix | tee orquestivo.vsix.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: |
            orquestivo.vsix
            orquestivo.vsix.sha256
          if-no-files-found: error
  marketplace:
    needs: [authorize, package]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - run: npx --no-install vsce publish --oidc --packagePath orquestivo.vsix --skip-duplicate
      - name: Verify storefront listing
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: node scripts/check-marketplace.mjs "$VERSION"
  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - run: node scripts/open-vsx-publish.mjs orquestivo.vsix --trusted-publishing
  release:
    needs: [authorize, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then echo "Release $tag exists"; exit 0; fi
          gh release create "$tag" orquestivo.vsix orquestivo.vsix.sha256 --target "$GITHUB_SHA" --title "Orquestivo $VERSION" --generate-notes
