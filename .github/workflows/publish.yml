# Release pipeline. Triggers: a push to main (only publishes when package.json holds a version that has no
# GitHub Release yet) or a manual dispatch (recovery / explicit confirmation). Every registry job still waits
# for approval on its protected Environment. No PR, tag or scheduled triggers.
# See docs/RELEASE.md for the approval checklist, environment setup and partial-publish recovery.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_ORQUESTIVO after the owner approved this exact commit
        type: string
        required: true
      version:
        description: Version to publish (must equal package.json version, e.g. 0.1.0)
        type: string
        required: true
      registries:
        description: Where to publish. Use a single registry only to recover a partial publish
        type: choice
        options: [both, marketplace, open-vsx]
        default: both
      vsix_run_id:
        description: Recovery only - run id of an earlier publish run whose verified VSIX artifact must be reused unchanged
        type: string
        required: false
permissions: {}
concurrency:
  group: orquestivo-release
  cancel-in-progress: false
jobs:
  authorize:
    name: Authorize release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirmation == 'PUBLISH_ORQUESTIVO')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release preconditions
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$version" = "$REQUESTED_VERSION" ] || { echo "::error::Requested version $REQUESTED_VERSION differs from package.json $version."; exit 1; }
          elif gh release view "v$version" > /dev/null 2>&1; then
            # Push to main without a version bump: nothing to publish.
            echo "Release v$version already exists; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The owner removes "private": true only when approving the release. While it is present nothing is published.
          if [ "$(node -p "Boolean(require('./package.json').private)")" = "true" ]; then
            echo "::error::package.json has \"private\": true. The owner must remove it in the approved release commit."
            exit 1
          fi
          grep -Fq "## [$version]" CHANGELOG.md || { echo "::error::A released changelog entry for $version is required."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  verify-platforms:
    name: Verify (${{ matrix.os }})
    needs: authorize
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:platform

  package:
    # Builds, fully verifies (strict, no cache) and packages the ONE VSIX that both marketplaces receive.
    name: Verify and package VSIX
    needs: authorize
    if: needs.authorize.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Full release gate (strict, no cache)
        if: inputs.vsix_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run verify:release
      - name: Reuse the verified VSIX of an earlier run (recovery)
        if: inputs.vsix_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          run-id: ${{ inputs.vsix_run_id }}
          github-token: ${{ github.token }}
      - name: Audit VSIX and verify checksum
        id: checksum
        run: |
          npm run audit:vsix
          node scripts/vsix-checksum.mjs check orquestivo.vsix
          echo "sha256=$(cut -d' ' -f1 orquestivo.vsix.sha256)" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        run: npm run sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: |
            orquestivo.vsix
            orquestivo.vsix.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            reports/verify-enterprise.json
            reports/verify-enterprise.md
            reports/sbom.cdx.json
            reports/mutation.json
            reports/coverage/summary.json
          if-no-files-found: warn
          retention-days: 90

  marketplace:
    name: Publish to Visual Studio Marketplace
    needs: [authorize, verify-platforms, package]
    if: needs.authorize.outputs.publish == 'true' && (github.event_name == 'push' || inputs.registries == 'both' || inputs.registries == 'marketplace')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protected environment: required reviewers, deployment branch limited to main, OIDC trust registered
    # for this repository and workflow. Never fall back to a long-lived token silently.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Verify the VSIX is the one that was verified
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node scripts/vsix-checksum.mjs check orquestivo.vsix --expect "$EXPECTED_SHA256"
      - run: npx --no-install vsce publish --oidc --packagePath orquestivo.vsix --skip-duplicate
      - name: Verify storefront listing (post-publish)
        env:
          VERSION: ${{ needs.authorize.outputs.version }}
        run: node scripts/check-marketplace.mjs "$VERSION"

  open-vsx:
    name: Publish to Open VSX
    needs: [authorize, verify-platforms, package]
    if: needs.authorize.outputs.publish == 'true' && (github.event_name == 'push' || inputs.registries == 'both' || inputs.registries == 'open-vsx')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: open-vsx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Verify the VSIX is the one that was verified
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node scripts/vsix-checksum.mjs check orquestivo.vsix --expect "$EXPECTED_SHA256"
      - run: node scripts/open-vsx-publish.mjs orquestivo.vsix --trusted-publishing

  release:
    # Runs only when every registry that was requested succeeded; a partial publish creates NO GitHub Release.
    name: GitHub Release
    needs: [authorize, package, marketplace, open-vsx]
    if: ${{ !cancelled() && needs.package.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.marketplace.result) && contains(fromJSON('["success","skipped"]'), needs.open-vsx.result) && (needs.marketplace.result == 'success' || needs.open-vsx.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
          path: evidence
      - name: Verify the VSIX checksum
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: node scripts/vsix-checksum.mjs check orquestivo.vsix --expect "$EXPECTED_SHA256"
      - name: Create GitHub Release (idempotent) and verify the uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; not modifying it."
          else
            extra=()
            [ -f evidence/sbom.cdx.json ] && extra+=(evidence/sbom.cdx.json)
            [ -f evidence/verify-enterprise.md ] && extra+=(evidence/verify-enterprise.md)
            gh release create "$tag" orquestivo.vsix orquestivo.vsix.sha256 "${extra[@]}" \
              --target "$GITHUB_SHA" --title "Orquestivo $VERSION" --generate-notes
          fi
          mkdir -p released
          gh release download "$tag" --pattern orquestivo.vsix --dir released --clobber
          node scripts/vsix-checksum.mjs check released/orquestivo.vsix --expect "$(cut -d' ' -f1 orquestivo.vsix.sha256)"
