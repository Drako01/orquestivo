# Temporary one-shot dependency lock bootstrap, removed after it commits package-lock.json.
name: bootstrap-dependency-lock
on:
  push:
    branches: [feat/mvp-foundation]
    paths:
      - .github/workflows/lock-bootstrap.yml
permissions:
  contents: write
jobs:
  lock:
    name: Create reproducible dependency lock
    if: github.repository == 'Drako01/orquestivo' && github.ref == 'refs/heads/feat/mvp-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "Lockfile already current"; exit 0; fi
          git commit -m "chore: pin reproducible dependencies"
          git push origin HEAD:refs/heads/feat/mvp-foundation
